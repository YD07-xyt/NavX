global_planning_node:
  ros__parameters:
    # ================================
    # 1. 基础话题与地图参数
    # ================================
    map_topic: "/rog_map/terrain_map" #"/rog_map/terrain_map"      # 订阅的障碍物点云话题（sensor_msgs/PointCloud2）
    target_topic: "/goal_pose"        # 订阅的目标点话题（geometry_msgs/PoseStamped）
    odom_topic: "/lio/base_odom"      # 订阅的里程计话题（nav_msgs/Odometry）
    
    map_size: 43.0                    # 栅格地图边长（米）。43对应±21.5m范围，调大覆盖广但计算慢，调小则反之
    resolution: 0.1                   # 地图分辨率（米/格）。0.1表示每格10cm，调小（如0.05）路径更精细但计算剧增
    
    # ================================
    # 2. A* 路径搜索参数（对应 fsm_config.astar_param_）
    # ================================
    max_vel: 3.2                      # 机器人最大线速度（m/s）。用户要求实际速度 max<3.2，故封顶 3.2（与 traj.max_v、lmpc.u_max 一致）
    max_acc: 3.0                      # 机器人最大加速度（m/s²）。调大：起步急停响应快；调小：加减速柔和平缓
    time_resolution: 0.1              # 轨迹时间采样间隔（秒）。调小：轨迹点数密集，控制更精细；调大：点数少，适合低速场景
    min_traj_num: 5                   # 最小轨迹点数。强制至少生成N个采样点，防止时间分配为0导致轨迹无效
    traj_cut_length: 2.0              # 轨迹截断长度（米）。如果A*总路径超过此值，会截断，避免超长路径计算耗时过长
    distance_weight: 1.0              # 距离代价权重。调大：更倾向于最短路径（走直线）；调小：允许绕远路以避障
    yaw_weight: 0.2                   # 航向变化惩罚权重。调大：减少转弯（适合阿克曼/差速）；调小：转弯灵活（适合全向）
                                          # 注意：绕障路径转角大，yaw_weight 过大会把 weighted_length 膨胀，
                                          # 直接拉长 A* 规划时长→参考轨迹变慢。已 0.5→0.2 提速。

    # ================================
    # 3. FSM 状态机参数（对应 fsm_config）
    # ================================
    fsm:
      safe_threshold: 0.45            # 安全距离阈值（米）。机器人中心到障碍物的最小允许距离。
                                          # 调大：更安全但易把起点/终点判为碰撞导致无法规划；调小：通过性更好但有擦碰风险
                                          # 注意：实测 0.9 时目标点净空仅 0.951m，A* 在 0.9m 净空下找不到通道而失败；
                                          # 已降到 0.45（在“能规划”与“安全”之间折中，未改回 A* 默认 0.3 是为了保留余量）。
      deviation:                      # 目标点位置容差（米），用于判断“目标是否改变”
        x: 0.5                        # 若新目标与旧目标 X 偏差 < 0.5，且
        y: 0.5                        # Y 偏差 < 0.5，且
        z: 0.0                        # Z 偏差 < 0.0，则FSM判定目标未变，不会触发重规划（仅检查原路径是否安全）
                                      # 调大容差可过滤目标点小幅漂移，减少重规划次数；设为0,0,0则每次收到目标都强制重规划

    # ================================
    # 4. 轨迹优化参数（对应 fsm_config.params_，即 TrajOpt）
    # ================================
    # 注：total_len / total_time / piece_len 已在 FSM::plan 中被 A* 路径的实际测量值覆盖，
    # 因此 YAML 中无需声明。如需固定值，请修改代码中覆盖逻辑。
    traj:
      rho_v: 100.0                    # 速度越界惩罚权重。调大：严格限制速度不超过 max_v；调小：允许短时超速（紧急加速）
      rho_collision: 8000.0           # 碰撞惩罚权重。调大：轨迹远离障碍物，更安全但路径可能绕远；调小：路径更短但靠障碍物近
                                          # 已 1000→8000：原软惩罚+线性段导致平滑时样条拱进障碍（穿障）。加强后基本消除穿障
      rho_T: 200.0                    # 时间惩罚权重。调大：优化器倾向于更短时间完成轨迹（速度剖面变高）；调小：允许慢慢走
                                          # 已 100→200，压住优化器把轨迹时长拉长的倾向（实测曾被从 10.6s 拉到 15.5s）
      rho_energy: 50.0                # 能量/平滑度惩罚权重。调大：轨迹极度平滑，加速度变化小，但可能拐大弯；调小：轨迹紧贴A*路径，但加速度抖动可能变大
                                          # 已 100→50，降低“为平滑而减速”的倾向，配合提速
      max_v: 3.2                      # 优化阶段的硬约束最大线速度（m/s）。用户要求实际速度 max<3.2，故封顶 3.2
                                          # 需与 astar.max_vel、lmpc.u_max 保持一致，否则最松那道卡住实际速度
      safe_threshold: 0.6             # 优化阶段的安全距离阈值（米）。与 FSM 中的阈值类似，但专用于样条优化碰撞检测
                                          # 略高于 fsm.safe_threshold(0.45) 留出余量；过高（如0.9）在窄通道会无可行解
      int_K: 48                       # 每段样条的采样点数。调大：碰撞检测更精确，但计算耗时翻倍；调小：计算快但可能遗漏碰撞点
                                          # 已 32→48：更密地采样碰撞，避免漏检样条穿障点
      mem_size: 256                   # L-BFGS 优化器存储的历史梯度数量。调大：收敛更快但内存占用多；调小：节省内存但收敛慢
      past: 3                         # 收敛检测的迭代窗口大小。检查过去 past 次迭代的函数值下降幅度，调大则收敛判断更严格
      g_epsilon: 1.0e-6               # 梯度范数收敛阈值。当梯度 < g_epsilon 时认为收敛。调小：更精确但迭代次数增多；调大：提前停止优化
      min_step: 1.0e-32               # 优化步长下界（防止步长过小死循环），保持默认即可
      delta: 1.0e-5                   # 函数值变化收敛阈值。当损失函数变化 < delta 时认为收敛。调小：更精确；调大：更快
      max_iter: 10000                 # 最大迭代次数。调大：优化更彻底但耗时；调小：防止死循环。推荐5000~20000

# ------------------ 5. LMPC 控制器参数 (新增) ------------------
    lmpc:
      N: 20                        # 预测步数，越大计算越慢但前瞻性越好
      dt: 0.05                     # 离散时间步长 (秒)，与规划器的 time_resolution 可不同
      
      # 控制输入边界（需与 traj.max_v / astar.max_vel 一致，均封顶 3.2）
      u_min_x: -3.2                # 最小线速度 X (m/s)
      u_min_y: -3.2                # 最小线速度 Y (m/s)
      u_min_w: -4.0                # 最小角速度 (rad/s)
      u_max_x:  3.2                # 最大线速度 X (m/s)
      u_max_y:  3.2                # 最大线速度 Y (m/s)
      u_max_w:  4.0                # 最大角速度 (rad/s)
      
      # 状态边界（通常不限制，设为 ±1e9 等价于无穷大）
      x_min_x: -1.0e9
      x_min_y: -1.0e9
      x_min_theta: -1.0e9
      x_max_x:  1.0e9
      x_max_y:  1.0e9
      x_max_theta:  1.0e9
      
      # 状态跟踪权重 Q（位置误差权重高，航向误差权重低）
      Q_x: 1.0
      Q_y: 1.0
      Q_theta: 0.1
      
      # 控制平滑权重 R（速度变化惩罚，越小响应越快）
      R_vx: 0.1
      R_vy: 0.1
      R_w: 0.05