controller_server:
  ros__parameters:
    cmd_vel_topic: "/cmd_vel_chassis"   # 改成你底盘订阅的话题
    use_sim_time: False
    controller_frequency: 50.0
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.1
    failure_tolerance: 0.5      # 0.3→0.5，转折处允许短暂失控不报错
    odom_topic: "/lio/base_odom"
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 3.14

    FollowPath:    
      plugin: "nav2_mppi_controller::MPPIController"
      
      adjustThre: 14.0
      minAngleDiff: 365.0
      adjustHeadingSpeed: 0.0
      
      time_steps: 50
      model_dt: 0.04
      batch_size: 2500          # 2000→2500，更多采样覆盖转折速度组合
      
      vx_max: 1.5
      vx_min: -1.5
      vy_max: 1.5
      wz_max: 0.01
      
      vx_std: 0.7               # 0.6→0.7，丰富纵向候选
      vy_std: 0.8               # 0.6→0.8，关键提高，转折处需要大量横向平移组合
      wz_std: 0.01
      
      ax_max: 1.6               # 1.5→1.6，适度加速
      ax_min: -2.2              # -2.5→-2.2，温和制动，不刹死
      ay_max: 2.0
      ay_min: -2.0
      az_max: 0.01
      az_min: -0.01
      
      iteration_count: 1
      prune_distance: 3.5
      transform_tolerance: 0.1
      temperature: 0.5          # 保持，平滑综合不跳变
      gamma: 0.08               # 0.065→0.08，提高轨迹平滑性，减少速度跳变
      motion_model: "Omni"
      visualize: false
      reset_period: 1.0         # 2.0→1.0，关键缩短，卡死后1秒就恢复
      regenerate_noises: false
      retry_attempt_limit: 5    # 3→5，给转折处更多尝试机会
      
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      
      critics: ["ObstaclesCritic", "GoalCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "CostCritic"]
      
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 2.0
      
      PreferForwardCritic:
        enabled: false
      
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.0       # 1.5→1.0，降低，转折处给路径跟踪留空间
        critical_weight: 35.0       # 40→35
        consider_footprint: false
        collision_cost: 10.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.1
        inflation_radius: 0.4
        cost_scaling_factor: 10.0
        inflation_layer_name: ["local_inflation_layer","global_inflation_layer"]
      
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0            # 保持，转折处宽容位置偏差
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 2
        threshold_to_consider: 2.0
        offset_from_furthest: 4     # 保持，只看脚下不跨越转折点
        use_path_orientations: false
      
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0           # 保持，中高前进激励
        offset_from_furthest: 5     # 保持
        threshold_to_consider: 2.0
      
      PathAngleCritic:
        enabled: true               # 关键启用，提供合速度方向连续性
        cost_power: 1
        cost_weight: 3.0            # 轻权重，软约束
        offset_from_furthest: 4
        threshold_to_consider: 2.0
        max_angle_to_furthest: 1.0  # 宽松，约57度，转折处允许大角度调整
        mode: 0
      
      TwirlingCritic:
        enabled: false
      
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        critical_cost: 253.0
        consider_footprint: false
        collision_cost: 100000.0
        near_goal_distance: 0.5
        trajectory_point_step: 3


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: world
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: ""
      robot_radius: 0.34
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 0
        origin_z: 0.0
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.0
        max_obstacle_height: 3.0
        min_obstacle_intensity: 0.1
        max_obstacle_intensity: 150.0
        observation_sources: terrain_map
        terrain_map:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: /cloud_preprocess/obstacles
          sensor_frame: imu
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.2
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.5
        inflation_radius: 0.55
      always_send_full_costmap: False

