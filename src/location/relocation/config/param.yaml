/**:
  ros__parameters:
    # ==========================================
    # 1. 节点自身基本参数
    # ==========================================
    map_frame: "map"                         # 地图坐标系
    odom_frame: "world"                      # 里程计坐标系 (即 map->odom 的发布目标)
    robot_base_frame: "base_link"                  # 用于init_pose
    lio_cloud_topic_name: "/lio/cloud_world" #cloud 话题
    pcd_load_name: "/home/xyt/nav_now/src/location/relocation/pcd/map.pcd"   # 加载的目标地图点云路径 (请修改为实际路径)
    pcd_filter_size: 0.25                    # 地图点云预处理的体素滤波尺寸
    accumulated_cloud_filter_size: 0.25      # 累积扫描点云的体素滤波尺寸
    min_sac_ia_score: 0.2                    # SAC-IA 粗匹配的得分阈值 (低于此值视为成功)
    max_relocation_time: 40                  # int 重定位最大时间&&success gicp
    end_relocation_time: 300                 # int 重定位最大时间

    # ==========================================
    # 2. 默认初始位姿 (兜底使用，当未收到 /initialpose 时生效)
    # ==========================================
    default_init_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      qx: 0.0
      qy: 0.0
      qz: 0.0
      qw: 1.0

    # ==========================================
    # 3. GICP 精配准参数
    # ==========================================
    gicp_num_neighbors: 10                   # 邻域点数
    gicp_num_threads: 4                      # 线程数
    gicp_max_dist_sq: 2.0                    # 最大距离平方阈值
    gicp_max_iterations: 60                  # 最大迭代次数
    registered_leaf_size: 0.25               # 源点云下采样尺寸
    global_leaf_size: 0.25                   # 目标点云下采样尺寸

    # ==========================================
    # 4. FPFH 特征计算参数
    # ==========================================
    fpfh_threads: 8                          # FPFH 计算线程数
    fpfh_normal_radius: 0.5                  # 法向量估计半径
    fpfh_estimator_radius: 1.0               # FPFH 特征估计半径

    # ==========================================
    # 5. SAC-IA 粗配准参数
    # ==========================================
    sac_iterations: 200                      # 迭代次数
    sac_min_sample_distance: 0.1             # 样本点间最小距离
    sac_k_num: 6                             # 特征匹配时使用的邻居数

    # ==========================================
    # 6. NDT 配准参数 (作为粗配准或备选)
    # ==========================================
    ndt_voxel_filter_size: 0.2               # NDT 内部体素滤波尺寸
    ndt_epsilon: 0.01                        # 收敛阈值
    ndt_step_size: 0.5                       # 步长
    ndt_resolution: 1.5                      # NDT 网格分辨率
    ndt_maximum_iterations: 50               # 最大迭代次数